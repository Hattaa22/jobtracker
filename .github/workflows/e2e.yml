name: Playwright E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-e2e:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        run: cd server && npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start Backend & Frontend
        env:
          PORT: 5000
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_jwt_secret_key_1234567890' }}
        run: |
          npm run server &
          npm run dev &
          npx wait-on http://localhost:5173 http://localhost:5000/api/health --timeout 60000

      - name: Run Playwright E2E Tests
        env:
          BASE_URL: http://localhost:5173/
          API_BASE_URL: http://localhost:5000/api
        run: npm run test:e2e:ci

      - name: Upload Playwright Report & Traces on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
